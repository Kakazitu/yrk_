<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>--Kakazitu--</title>
    <link rel="icon" href="kakazitu.png" type="image/png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap">
    <style>
        /* Estilos */
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            object-fit: cover;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="intro-screen" id="introScreen">
        <h1 id="tapText">Tap to Enter</h1>
    </div>

    <div class="container" id="mainContent">
        <img src="kakazitu.png" alt="Foto de Perfil" class="profile-img" id="profileImg">
        <div class="name">Kakazitu</div>
        <div class="description">Desenvolvedor | Criador de Conteúdo</div>
    </div>

    <audio id="musicPlayer" loop>
        <source id="musicSource" src="musica1.mp3" type="audio/mp3">
        Seu navegador não suporta o elemento de áudio.
    </audio>

    <script>
        const musicas = ["musica1.mp3", "musica2.mp3", "musica3.mp3"];
        const musicPlayer = document.getElementById("musicPlayer");
        const introScreen = document.getElementById("introScreen");
        const mainContent = document.getElementById("mainContent");
        const profileImg = document.getElementById("profileImg");

        let videoElement;

        // Tocar música aleatória
        function tocarMusicaAleatoria() {
            const randomIndex = Math.floor(Math.random() * musicas.length);
            const musicSource = document.getElementById("musicSource");
            musicSource.src = musicas[randomIndex];
            musicPlayer.load();
            musicPlayer.play();

            if (musicas[randomIndex] === "musica2.mp3") {
                trocarParaVideoSemParar("lost2.mp4");
            } else {
                restaurarImagemOriginal();
            }
        }

        // Vídeo que continua rodando sem parar (como no YouTube)
        function trocarParaVideoSemParar(videoSrc) {
            if (!videoElement || videoElement.tagName !== 'VIDEO') {
                videoElement = document.createElement('video');
                videoElement.src = videoSrc;
                videoElement.classList.add('profile-img');
                videoElement.autoplay = true;
                videoElement.muted = true;
                videoElement.loop = true;
                profileImg.replaceWith(videoElement);

                // Garante que o vídeo continue rodando ao alternar abas
                document.addEventListener("visibilitychange", () => {
                    if (document.visibilityState === "hidden") {
                        videoElement.play(); // Força o vídeo a continuar tocando
                    } else if (document.visibilityState === "visible") {
                        videoElement.play(); // Certifica que ele não foi pausado
                    }
                });
            }
        }

        // Restaurar a imagem original
        function restaurarImagemOriginal() {
            if (profileImg.tagName === 'VIDEO') {
                const newImage = document.createElement('img');
                newImage.src = "kakazitu.png";
                newImage.classList.add('profile-img');
                videoElement.replaceWith(newImage);
            }
        }

        introScreen.addEventListener("click", function () {
            introScreen.style.opacity = 0;

            setTimeout(function () {
                introScreen.style.display = "none";
                mainContent.style.opacity = 1;
                tocarMusicaAleatoria();
            }, 1000);
        });
    </script>
</body>
</html>
