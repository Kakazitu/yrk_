<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>--Kakazitu--</title>
    <link rel="icon" href="kakazitu.png" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="intro-screen" id="introScreen">
        <h1 id="tapText">Tap to Enter</h1>
    </div>

    <div class="container" id="mainContent">
        <img src="kakazitu.png" alt="Foto de Perfil" class="profile-img" id="profileImage">
        <video class="profile-img" id="profileVideo" loop muted style="display: none;">
            <source src="lost1.mp4" type="video/mp4">
            Seu navegador não suporta o elemento de vídeo.
        </video>
        <div class="name">Kakazitu</div>
        <div class="description">Desenvolvedor | Criador de Conteúdo</div>

        <div class="links">
            <a href="http://discordapp.com/users/1136065248420438047" target="_blank">
                <img src="discord-logo1.png" alt="Discord Logo">
            </a>
            <a href="https://www.roblox.com/pt/users/2798972541/profile" target="_blank">
                <img src="roblox-logo1.png" alt="Roblox Logo">
            </a>
        </div>

        <footer>&copy; 2024 Kakazitu | Todos os direitos reservados</footer>

        <div class="volume-control">
            <label for="volumeSlider">Volume:</label>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1">
        </div>
    </div>

    <audio id="musicPlayer" loop>
        <source id="musicSource" src="musica1.mp3" type="audio/mp3">
        Seu navegador não suporta o elemento de áudio.
    </audio>

    <script>
        const musicas = ["musica1.mp3", "musica2.mp3", "musica3.mp3"];
        let lastPlayed = -1;
        const musicPlayer = document.getElementById("musicPlayer");
        const introScreen = document.getElementById("introScreen");
        const mainContent = document.getElementById("mainContent");
        const volumeSlider = document.getElementById("volumeSlider");

        const profileImage = document.getElementById("profileImage");
        const profileVideo = document.getElementById("profileVideo");

        // Troca de imagem para vídeo
        function verificarMusicaAtual() {
            const musicaAtual = document.getElementById("musicSource").src;

            if (musicaAtual.includes("musica1.mp3") && !musicPlayer.paused) {
                profileImage.style.display = "none";
                profileVideo.style.display = "block";
                profileVideo.play();
            } else {
                profileVideo.pause();
                profileVideo.style.display = "none";
                profileImage.style.display = "block";
            }
        }

        function tocarMusicaAleatoria() {
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * musicas.length);
            } while (randomIndex === lastPlayed);

            const musicSource = document.getElementById("musicSource");
            musicSource.src = musicas[randomIndex];  
            musicPlayer.load();
            musicPlayer.play();

            lastPlayed = randomIndex;
        }

        // Ajusta o volume
        volumeSlider.addEventListener("input", function() {
            musicPlayer.volume = volumeSlider.value;
        });

        introScreen.addEventListener("click", function() {
            introScreen.style.opacity = 0;

            setTimeout(function() {
                introScreen.style.display = "none";
                mainContent.style.opacity = 1;
                tocarMusicaAleatoria();
            }, 1000);
        });

        // Eventos para alternar entre imagem e vídeo
        musicPlayer.addEventListener("play", verificarMusicaAtual);
        musicPlayer.addEventListener("pause", verificarMusicaAtual);
        musicPlayer.addEventListener("ended", verificarMusicaAtual);
        musicPlayer.addEventListener("loadeddata", verificarMusicaAtual);
    </script>
</body>
</html>
