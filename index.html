<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>--Kakazitu--</title>
    <link rel="icon" href="kakazitu.png" type="image/png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Fira Code', monospace;
            background: linear-gradient(135deg, #1a1a1a, #0d0d0d);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 1s ease-in-out;
        }

        .intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 9999;
            transition: opacity 1s ease-in-out;
            cursor: pointer;
        }

        .intro-screen h1 {
            font-size: 2.5em;
            color: white;
            text-align: center;
        }

        .container {
            text-align: center;
            max-width: 600px;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin-bottom: 20px;
            border: 3px solid white;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            object-fit: cover;
        }

        .name {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #ff4747;
        }

        .description {
            font-size: 1.2em;
            color: #ccc;
            margin-bottom: 30px;
        }

        .links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .links a {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 60px;
            height: 60px;
            background: #292929;
            border-radius: 50%;
            transition: transform 0.3s, background 0.3s;
        }

        .links a img {
            width: 30px;
            height: 30px;
        }

        .links a:hover {
            transform: scale(1.2);
            background: #ff4747;
        }

        footer {
            margin-top: 30px;
            font-size: 0.9em;
            color: #666;
        }

        .volume-control {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ccc;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 150px;
            height: 10px;
            background: #555;
            border-radius: 5px;
            outline: none;
            position: relative;
            margin: 0 10px;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            height: 10px;
            background: #555;
            border-radius: 5px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            background: #ff4747;
            border-radius: 50%;
            position: relative;
            transition: background 0.3s ease-in-out;
            margin-top: -6px;
        }

        input[type="range"]:active::-webkit-slider-thumb {
            background: #e63946;
        }

        audio {
            display: none;
        }
    </style>
</head>
<body>
    <div class="intro-screen" id="introScreen">
        <h1 id="tapText">Tap to Enter</h1>
    </div>

    <div class="container" id="mainContent">
        <img src="kakazitu.png" alt="Foto de Perfil" class="profile-img" id="profileImg">
        <div class="name">Kakazitu</div>
        <div class="description">Desenvolvedor | Criador de Conteúdo</div>

        <div class="links">
            <a href="http://discordapp.com/users/1136065248420438047" target="_blank">
                <img src="discord-logo1.png" alt="Discord Logo">
            </a>
            <a href="https://www.roblox.com/pt/users/2798972541/profile" target="_blank">
                <img src="roblox-logo1.png" alt="Roblox Logo">
            </a>
        </div>

        <footer>&copy; 2024 Kakazitu | Todos os direitos reservados</footer>

        <div class="volume-control">
            <label for="volumeSlider">Volume:</label>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1">
        </div>
    </div>

    <audio id="musicPlayer" loop>
        <source id="musicSource" src="musica3.mp3" type="audio/mp3">
        Seu navegador não suporta o elemento de áudio.
    </audio>

    <script>
        const musicas = ["lost1.mp4", "lost2.mp4", "kakazitu.png"]; // Ajustado para vídeos e imagem padrão
        let currentTrack = 0; // Começar com o primeiro item (lost1.mp4)
        const musicPlayer = document.getElementById("musicPlayer");
        const musicSource = document.getElementById("musicSource");
        const introScreen = document.getElementById("introScreen");
        const mainContent = document.getElementById("mainContent");
        const volumeSlider = document.getElementById("volumeSlider");
        const profileImg = document.getElementById("profileImg");

        function tocarMusica() {
            const selectedTrack = musicas[currentTrack];

            if (selectedTrack.endsWith(".mp4")) {
                // Se for um vídeo
                profileImg.outerHTML = `<video class="profile-img" autoplay loop muted id="profileImg">
                                            <source src="${selectedTrack}" type="video/mp4">
                                            Seu navegador não suporta o vídeo.
                                          </video>`;
            } else if (selectedTrack === "kakazitu.png") {
                // Se for a imagem padrão
                profileImg.outerHTML = `<img src="kakazitu.png" alt="Foto de Perfil" class="profile-img" id="profileImg">`;
            }

            // Avançar para o próximo item na sequência (circular)
            currentTrack = (currentTrack + 1) % musicas.length;
        }

        volumeSlider.addEventListener("input", function() {
            if (musicPlayer.paused) {
                // Ajuste de volume para a música, se a música estiver sendo reproduzida
                musicPlayer.volume = volumeSlider.value;
            }
        });

        introScreen.addEventListener("click", function() {
            introScreen.style.opacity = 0;
            setTimeout(function() {
                introScreen.style.display = "none";
                mainContent.style.opacity = 1;
                tocarMusica();  // Tocar a música ao entrar
            }, 1000);
        });

        // Garantir que a música seja tocada em sequência sempre que a página for carregada
        window.onload = function() {
            tocarMusica();  // Começa o vídeo/música ao carregar a página
        };
    </script>
</body>
</html>
