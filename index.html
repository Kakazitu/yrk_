<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio - Kakazitu</title>
    <link rel="icon" href="sua-foto.png" type="image/png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
            font-family: 'Fira Code', monospace;
            background: linear-gradient(135deg, #1a1a1a, #0d0d0d);
            color: white;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            text-align: center;
            max-width: 600px;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin-bottom: 20px;
            border: 3px solid white;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }
        .name {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #ff4747;
        }
        .subtitle {
            font-size: 1.2em;
            margin-bottom: 30px;
            color: #ccc;
        }
        .links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .links a {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 60px;
            height: 60px;
            background: #292929;
            border-radius: 50%;
            transition: transform 0.3s, background 0.3s;
        }
        .links a img {
            width: 30px;
            height: 30px;
        }
        .links a:hover {
            transform: scale(1.2);
            background: #ff4747;
        }
        .badges-panel {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        .badge {
            position: relative;
            width: 50px;
            height: 50px;
            transition: transform 0.3s;
        }
        .badge img {
            width: 100%;
            height: 100%;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }
        .badge:hover {
            transform: scale(1.2);
        }
        .badge::after {
            content: attr(data-title);
            position: absolute;
            top: 110%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.8em;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s, transform 0.3s;
        }
        .badge:hover::after {
            opacity: 1;
            transform: translateX(-50%) translateY(10px);
        }
        footer {
            margin-top: 30px;
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="sua-foto.png" alt="Foto de Perfil" class="profile-img">
        <div class="name">Kakazitu</div>
        <div class="subtitle">Desenvolvedor | Criador de Conteúdo</div>

        <div class="links">
            <a href="http://discordapp.com/users/749409557209677835" target="_blank">
                <img src="discord-logo1.png" alt="Discord Logo">
            </a>
            <a href="https://www.roblox.com/pt/users/2798972541/profile" target="_blank">
                <img src="roblox-logo1.png" alt="Roblox Logo">
            </a>
        </div>

        <div class="badges-panel">
            <div class="badge" data-title="Owner Badge">
                <img src="badge-owner.png" alt="Owner Badge">
            </div>
            <div class="badge" data-title="Premium Badge">
                <img src="badge-premium.png" alt="Premium Badge">
            </div>
        </div>

        <footer>&copy; 2024 Kakazitu | Todos os direitos reservados</footer>
    </div>
</body>
</html>
