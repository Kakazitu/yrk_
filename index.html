<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>--Kakazitu--</title>
    <link rel="icon" href="kakazitu.png" type="image/png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
            font-family: 'Fira Code', monospace;
            background: linear-gradient(135deg, #1a1a1a, #0d0d0d);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            text-align: center;
            max-width: 600px;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin-bottom: 20px;
            border: 3px solid white;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }
        .name {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #ff4747;
        }
        .description {
            font-size: 1.2em;
            color: #ccc;
            margin-bottom: 30px;
        }

        .links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .links a {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 60px;
            height: 60px;
            background: #292929;
            border-radius: 50%;
            transition: transform 0.3s, background 0.3s;
        }
        .links a img {
            width: 30px;
            height: 30px;
        }
        .links a:hover {
            transform: scale(1.2);
            background: #ff4747;
        }
        footer {
            margin-top: 30px;
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="kakazitu.png" alt="Foto de Perfil" class="profile-img">
        <div class="name">Kakazitu</div>
        <div class="description">Desenvolvedor | Criador de Conteúdo</div>

        <div class="links">
            <a href="http://discordapp.com/users/1136065248420438047" target="_blank">
                <img src="discord-logo1.png" alt="Discord Logo">
            </a>
            <a href="https://www.roblox.com/pt/users/2798972541/profile" target="_blank">
                <img src="roblox-logo1.png" alt="Roblox Logo">
            </a>
        </div>

        <footer>&copy; 2024 Kakazitu | Todos os direitos reservados</footer>
    </div>

    <!-- Música em background -->
    <audio id="musicPlayer" autoplay loop>
        <source id="musicSource" src="musica1.mp3" type="audio/mp3">
        Seu navegador não suporta o elemento de áudio.
    </audio>

    <script>
        // Array com as músicas
        const musicas = ["musica1.mp3", "musica2.mp3", "musica3.mp3"];
        let lastPlayed = -1;  // Variável para armazenar o índice da última música tocada

        // Função para tocar uma música aleatória
        function tocarMusicaAleatoria() {
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * musicas.length);  // Escolhe aleatoriamente uma música
            } while (randomIndex === lastPlayed);  // Garante que a mesma música não será tocada duas vezes consecutivas

            // Atualiza a música no player
            const musicPlayer = document.getElementById("musicPlayer");
            const musicSource = document.getElementById("musicSource");
            musicSource.src = musicas[randomIndex];  // Define o caminho da nova música
            musicPlayer.load();  // Carrega a nova música
            musicPlayer.play();  // Toca a nova música

            // Atualiza o índice da última música tocada
            lastPlayed = randomIndex;
        }

        // Tocar a primeira música assim que a página for carregada
        window.onload = function() {
            tocarMusicaAleatoria();  // Toca uma música aleatória
        }

        // Adiciona um evento para tocar uma nova música quando a atual termina
        document.getElementById("musicPlayer").addEventListener("ended", tocarMusicaAleatoria);
    </script>
</body>
</html>
