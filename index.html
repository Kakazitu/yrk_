<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kakazitu - Portfólio</title>
    <link rel="icon" href="kakazitu.png" type="image/png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
            font-family: 'Fira Code', monospace;
            background: linear-gradient(135deg, #1a1a1a, #0d0d0d);
            color: white;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            text-align: center;
            max-width: 600px;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin-bottom: 20px;
            border: 3px solid white;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }
        .name {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #ff4747;
        }
        .typing-animation {
            font-size: 1.2em;
            margin-bottom: 30px;
            color: #ccc;
            overflow: hidden;
            border-right: 2px solid #ff4747;
            white-space: nowrap;
            width: 0;
        }

        /* Animação de digitação */
        @keyframes typing {
            from { width: 0; }
            to { width: 15ch; }
        }

        /* Animação de apagar */
        @keyframes erase {
            from { width: 15ch; }
            to { width: 0; }
        }

        /* Ciclo de animação para alternar entre as duas frases */
        .dev-text {
            animation: typing 3s steps(15, end) 1, visibleFor 5s 3s forwards, erase 2s steps(15, end) 8s forwards;
        }

        .creator-text {
            animation: typing 3s steps(22, end) 1, visibleFor 5s 3s forwards, erase 2s steps(22, end) 8s forwards;
        }

        @keyframes visibleFor {
            0%, 66% { width: 15ch; }
            66.01%, 100% { width: 0; }
        }

        .links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .links a {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 60px;
            height: 60px;
            background: #292929;
            border-radius: 50%;
            transition: transform 0.3s, background 0.3s;
        }
        .links a img {
            width: 30px;
            height: 30px;
        }
        .links a:hover {
            transform: scale(1.2);
            background: #ff4747;
        }
        footer {
            margin-top: 30px;
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="kakazitu.png" alt="Foto de Perfil" class="profile-img">
        <div class="name">Kakazitu</div>
        <div class="typing-animation dev-text">Desenvolvedor</div>
        <div class="typing-animation creator-text" style="display: none;">Criador de Conteúdo</div>

        <div class="links">
            <a href="http://discordapp.com/users/1136065248420438047" target="_blank">
                <img src="discord-logo1.png" alt="Discord Logo">
            </a>
            <a href="https://www.roblox.com/pt/users/2798972541/profile" target="_blank">
                <img src="roblox-logo1.png" alt="Roblox Logo">
            </a>
        </div>

        <footer>&copy; 2024 Kakazitu | Todos os direitos reservados</footer>
    </div>

    <script>
        let devText = document.querySelector('.dev-text');
        let creatorText = document.querySelector('.creator-text');

        function toggleText() {
            devText.style.display = devText.style.display === 'none' ? 'block' : 'none';
            creatorText.style.display = creatorText.style.display === 'none' ? 'block' : 'none';
        }

        setInterval(toggleText, 18000); // Alterna entre as duas frases a cada 18 segundos
    </script>
</body>
</html>
